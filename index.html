        // Task Selector Helper with anti-repetition and retry logic
        function getNextTask(tense = 'ALL', form = 'ALL', currentTask = null) {
            let filtered = grade4Tasks.map((task, index) => ({ task, index })).filter(item => {
                const t = item.task;
                if (tense !== 'ALL' && t.tense !== tense) return false;
                if (form !== 'ALL') {
                    const formMap = {
                        'Affirmative': 'Affirmative (+)',
                        'Negative': 'Negative (-)',
                        'Interrogative': 'Interrogative (?)'
                    };
                    const targetForm = formMap[form] || form;
                    if (t.form !== targetForm) return false;
                }
                return true;
            });

            // Отфильтровываем карточки, которые ученик уже правильно ответил
            let available = filtered.filter(item => !completedTaskIndices.has(item.index));

            // Если все карточки этой категории уже пройдены, сбрасываем историю для категории
            if (available.length === 0) {
                filtered.forEach(item => completedTaskIndices.delete(item.index));
                available = filtered;
            }

            // Исключаем текущую карточку, чтобы избежать подряд одинаковых (если есть выбор)
            if (available.length > 1 && currentTask) {
                available = available.filter(item => item.task !== currentTask);
            }

            const selected = available[Math.floor(Math.random() * available.length)];
            return selected ? selected.task : grade4Tasks[0];
        }

            `).join('');
        }

        function selectChat(chatId) {
            activeChatId = chatId;
            renderChatList();
            renderMessages();
            showChatMobile();
        }

        function formatMarkdown(text) {
            if (!text) return '';
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function renderMessages() {
            const messagesContainer = document.getElementById('messages-container');
            const activeChat = chatsData.find(c => c.id === activeChatId);
            if (!messagesContainer || !activeChat) return;

            messagesContainer.innerHTML = activeChat.messages.map(msg => {
                const isUser = msg.sender === 'user';
                return `
                    <div class="flex flex-col ${isUser ? 'items-end' : 'items-start'} my-2">
                        <div class="relative max-w-[85%] sm:max-w-[75%] px-4 py-2.5 rounded-2xl text-sm shadow-md ${
                            isUser 
                                ? 'bg-blue-600 text-white bubble-out rounded-br-none' 
                                : 'bg-slate-800 text-slate-100 border border-slate-700/60 bubble-in rounded-bl-none'
                        }">
                            <div class="leading-relaxed">${formatMarkdown(msg.text)}</div>
                            <div class="text-[10px] text-right mt-1 opacity-70 flex items-center justify-end gap-1">
                                <span>${msg.time}</span>
                                ${isUser ? '<i class="fa-solid fa-check-double text-[10px]"></i>' : ''}
                            </div>
                        </div>
                        ${msg.inlineButtons ? `
                            <div class="flex flex-wrap gap-2 mt-2 max-w-[85%] sm:max-w-[75%]">
                                ${msg.inlineButtons.map(btn => `
                                    <button onclick="handleInlineAction('${btn.action}')" class="tg-inline-btn px-3 py-1.5 rounded-xl text-xs font-medium text-blue-300 flex items-center gap-1.5 shadow">
                                        ${btn.text}
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function renderTeacherLogs() {
            const tableBody = document.getElementById('teacher-log-table');
            const accuracyVal = document.getElementById('teacher-accuracy-val');
            const totalAnswers = document.getElementById('teacher-total-answers');
            const streakVal = document.getElementById('teacher-streak-val');

            if (accuracyVal) {
                const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 100;
                accuracyVal.textContent = acc + '%';
            }
            if (totalAnswers) totalAnswers.textContent = stats.total + ' карточек';
            if (streakVal) streakVal.textContent = stats.streak;

            if (!tableBody) return;

            if (teacherLogs.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="p-4 text-center text-slate-500 italic">Ответов пока нет. Начните выполнять задания в чате!</td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = teacherLogs.map(log => `
                <tr class="hover:bg-slate-800/50 transition border-b border-slate-800/40">
                    <td class="p-3 text-slate-400 font-mono text-[11px]">${log.time}</td>
                    <td class="p-3"><span class="bg-slate-800 px-2 py-0.5 rounded text-blue-400">${log.tense} (${log.form})</span></td>
                    <td class="p-3 font-medium text-slate-200">${log.russian}</td>
                    <td class="p-3 text-slate-300 font-mono">${log.userAnswer}</td>
                    <td class="p-3 text-emerald-400/90 font-mono">${log.correctAnswer}</td>
                    <td class="p-3 text-center">
                        ${log.status === 'correct' 
                            ? '<span class="bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full text-[10px] font-bold">✓ Верно</span>'
                            : '<span class="bg-red-500/20 text-red-400 px-2.5 py-1 rounded-full text-[10px] font-bold">✗ Ошибка</span>'
                        }
                    </td>
                </tr>
            `).join('');
        }

        function setupFilterButtons() {
            const tenseBtns = document.querySelectorAll('.tense-selector-btn');
            const formBtns = document.querySelectorAll('.form-selector-btn');
            const badge = document.getElementById('active-tense-badge');

            tenseBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tenseBtns.forEach(b => {
                        b.classList.remove('active', 'bg-blue-600', 'text-white');
                        b.classList.add('bg-slate-800', 'hover:bg-slate-700', 'text-slate-300');
                    });
                    btn.classList.add('active', 'bg-blue-600', 'text-white');
                    btn.classList.remove('bg-slate-800', 'hover:bg-slate-700', 'text-slate-300');
                    
                    activeTenseSetting = btn.getAttribute('data-tense');
                    if (badge) {
                        badge.textContent = activeTenseSetting === 'ALL' ? 'Все времена' : activeTenseSetting;
                    }
                    switchTaskToFilter();
                });
            });

            formBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    formBtns.forEach(b => {
                        b.classList.remove('active', 'bg-indigo-600', 'text-white');
                        b.classList.add('bg-slate-800', 'hover:bg-slate-700', 'text-slate-300');
                    });
                    btn.classList.add('active', 'bg-indigo-600', 'text-white');
                    btn.classList.remove('bg-slate-800', 'hover:bg-slate-700', 'text-slate-300');
                    
                    activeFormSetting = btn.getAttribute('data-form');
                    switchTaskToFilter();
                });
            });
        }

        function switchTaskToFilter() {
            const chat = chatsData.find(c => c.id === 'english-bot');
            if (!chat) return;
            
            const newTask = getNextTask(activeTenseSetting, activeFormSetting, chat.currentTask);
            chat.currentTask = newTask;

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            chat.messages.push({
                id: Date.now(),
                sender: 'them',
                text: `🎯 **Выбрана новая тема (4 класс)!**\nВремя: **${newTask.tense}** | Форма: **${newTask.form}**\n\nПереведи предложение:\n👉 **"${newTask.russian}"**`,
                time: timeStr,
                inlineButtons: [
                    { text: "💡 Подсказка", action: "hint" },
                    { text: "⏭️ Пропустить", action: "next" },
                    { text: "🏁 Завершить урок", action: "finish_lesson" }
                ]
            });
            renderMessages();
        }

        function handleInlineAction(action) {
            if (action === 'start_lesson') {
                startLesson();
                return;
            }
            if (action === 'finish_lesson') {
                finishLesson();
                return;
            }

            const chat = chatsData.find(c => c.id === 'english-bot');
            if (!chat || !chat.currentTask) return;
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            if (action === 'hint') {
                const words = chat.currentTask.english.split(' ');
                chat.messages.push({
                    id: Date.now(),
                    sender: 'them',
                    text: `💡 **Подсказка**: Первые слова: **"${words.slice(0, 2).join(' ')}..."**`,
                    time: timeStr
                });
                renderMessages();
            } else if (action === 'next') {
                if (isLessonActive) {
                    stats.total++;
                    document.getElementById('stat-progress').textContent = `${stats.total}/${lessonTarget}`;
                    if (stats.total >= lessonTarget) {
                        finishLesson();
                        return;
                    }
                }
                const nextT = getNextTask(activeTenseSetting, activeFormSetting, chat.currentTask);
                chat.currentTask = nextT;
                const remaining = isLessonActive ? (lessonTarget - stats.total) : 0;
                const progressText = isLessonActive ? `\n📊 **Прогресс**: Карточка **${stats.total + 1} из ${lessonTarget}** (Осталось: ${remaining})` : '';

                chat.messages.push({
                    id: Date.now(),
                    sender: 'them',
                    text: `⏭️ **Задание пропущено!** Новая карточка:${progressText}\nВремя: **${nextT.tense}** | Форма: **${nextT.form}**\n\nПереведи:\n👉 **"${nextT.russian}"**`,
                    time: timeStr,
                    inlineButtons: [
                        { text: "💡 Подсказка", action: "hint" },
                        { text: "⏭️ Пропустить", action: "next" },
                        { text: "🏁 Завершить урок", action: "finish_lesson" }
                    ]
                });
                renderMessages();
            } else if (action === 'rule') {
                let ruleText = "Запомни порядок слов!";
                if (chat.currentTask.tense === "Present Simple") ruleText = "Present Simple: I/you/we/they + verb, He/She/It + verb(-s). Для вопросов и отрицаний используем do/does.";
                if (chat.currentTask.tense === "Present Continuous") ruleText = "Present Continuous: am/is/are + глагол с -ing (действие происходит прямо сейчас).";
                if (chat.currentTask.tense === "Past Simple") ruleText = "Past Simple: глагол во 2-й форме или с -ed. Для вопросов и отрицаний — did.";
                if (chat.currentTask.tense === "Future Simple") ruleText = "Future Simple: will + глагол (действие произойдет в будущем).";

                chat.messages.push({
                    id: Date.now(),
                    sender: 'them',
                    text: `📚 **Шпаргалка (${chat.currentTask.tense})**:\n${ruleText}`,
                    time: timeStr
                });
                renderMessages();
            }
        }

        function checkVocabularyQuery(input) {
            const lower = input.toLowerCase().trim();
            const triggers = ["как будет", "как переводится", "что такое", "как по английски", "как по-английски", "переведи"];

            const isQuery = triggers.some(t => lower.includes(t));
            if (!isQuery) return { found: false };

            let targetWord = lower;
            triggers.forEach(t => { targetWord = targetWord.replace(t, ""); });
            targetWord = targetWord.replace(/на английский|на английском|по английски|по-английски|слово/g, "").replace(/[.,!??"'«»]/g, "").trim();

            if (!targetWord) return { found: false };

            if (wordDictionary[targetWord]) {
                return { found: true, word: targetWord, translation: wordDictionary[targetWord] };
            }
            return { found: true, word: targetWord, translation: null };
        }

        function evaluateTranslation(userTranslation, currentTask) {
            const cleanUser = userTranslation.trim().toLowerCase().replace(/[.,!?]/g, '');
            const cleanTarget = currentTask.english.trim().toLowerCase().replace(/[.,!?]/g, '');
            
            const isCorrect = cleanUser === cleanTarget || cleanUser.includes(cleanTarget);

            return {
                isCorrect: isCorrect,
                feedback: isCorrect 
                    ? `🎉 **Молодец! Всё правильно!**\nПравильная фраза: **${currentTask.english}**`
                    : `❌ **Почти получилось! Ошибка в ответе.**\nТвой ответ: "${userTranslation}"\nПравильно писать: **${currentTask.english}**`
            };
        }

        document.getElementById('message-form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputEl = document.getElementById('message-input');
            const text = inputEl.value.trim();
            if (!text) return;

            const chat = chatsData.find(c => c.id === 'english-bot');
            if (!chat) return;

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            chat.messages.push({ id: Date.now(), sender: 'user', text: text, time: timeStr });
            inputEl.value = '';
            renderMessages();

            const vocabCheck = checkVocabularyQuery(text);
            if (vocabCheck.found) {
                setTimeout(() => {
                    let responseText = vocabCheck.translation 
                        ? `📖 **Словарь 4 класса**:\nСлово **"${vocabCheck.word}"** по-английски будет: **"${vocabCheck.translation}"** ✨\n\nПродолжим задание:\n👉 **"${chat.currentTask.russian}"**`
                        : `📖 **Словарь**: Слово **"${vocabCheck.word}"** пока отсутствует в базе. Переведи предложение:\n👉 **"${chat.currentTask.russian}"**`;

                    chat.messages.push({ id: Date.now() + 1, sender: 'them', text: responseText, time: timeStr });
                    renderMessages();
                }, 400);
                return;
            }

            const res = evaluateTranslation(text, chat.currentTask);
            stats.total++;

            if (res.isCorrect) {
                stats.correct++;
                stats.streak++;
                if (stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;

                // Вносим карточку в список решенных, чтобы она не повторялась
                const taskIdx = grade4Tasks.indexOf(chat.currentTask);
                if (taskIdx !== -1) {
                    completedTaskIndices.add(taskIdx);
                }
            } else {
                stats.streak = 0;
            }

            if (!isLessonActive) {
                isLessonActive = true;
                startLessonTimer();
                const btn = document.getElementById('lesson-toggle-btn');
                if (btn) btn.className = "bg-rose-600 hover:bg-rose-500 text-white font-medium px-3.5 py-1.5 rounded-xl text-xs flex items-center gap-1.5 transition shadow-md shadow-rose-600/30 animate-pulse";
            }

            teacherLogs.unshift({
                time: timeStr,
                tense: chat.currentTask.tense,
                form: chat.currentTask.form,
                russian: chat.currentTask.russian,
                userAnswer: text,
                correctAnswer: chat.currentTask.english,
                status: res.isCorrect ? 'correct' : 'incorrect'
            });

            document.getElementById('stat-correct').textContent = stats.correct;
            document.getElementById('stat-streak').textContent = stats.streak + ' стрик';
            document.getElementById('stat-progress').textContent = `${stats.total}/${lessonTarget}`;

            if (isLessonActive && stats.total >= lessonTarget) {
                setTimeout(() => {
                    chat.messages.push({
                        id: Date.now() + 2,
                        sender: 'them',
                        text: `${res.feedback}\n\n🎉 **ОТЛИЧНО! Вы выполнили все ${lessonTarget} предложений урока!**`,
                        time: timeStr
                    });
                    renderMessages();
                    renderTeacherLogs();
                    finishLesson();
                }, 500);
                return;
            }

            // Выбор следующей карточки:
            // Если ответ верный — выдаем новую карточку из нерешенных
            // Если ответ неверный — не меняем currentTask (повторяем задание)
            if (res.isCorrect) {
                chat.currentTask = getNextTask(activeTenseSetting, activeFormSetting, chat.currentTask);
            }

            const remainingCount = lessonTarget - stats.total;
            const progressInfo = `\n📊 **Прогресс**: Карточка **${stats.total + 1} из ${lessonTarget}** (Осталось: ${remainingCount})`;

            const nextPromptHeader = res.isCorrect 
                ? `📌 **СЛЕДУЮЩЕЕ ЗАДАНИЕ**:${progressInfo}` 
                : `🔁 **ПОВТОР ЗАДАНИЯ (попробуй ещё раз):**${progressInfo}`;

            setTimeout(() => {
                chat.messages.push({
                    id: Date.now() + 2,
                    sender: 'them',
                    text: `${res.feedback}\n\n${nextPromptHeader}\nВремя: **${chat.currentTask.tense}** | Форма: **${chat.currentTask.form}**\n\nПереведи предложение:\n👉 **"${chat.currentTask.russian}"**`,
                    time: timeStr,
                    inlineButtons: [
                        { text: "💡 Подсказка", action: "hint" },
                        { text: "⏭️ Пропустить", action: "next" },
                        { text: "🏁 Завершить урок", action: "finish_lesson" }
                    ]
                });
                renderMessages();
                renderTeacherLogs();
            }, 500);
        });

        window.addEventListener('DOMContentLoaded', () => {
            setupFilterButtons();
            renderChatList();
            renderMessages();
            renderTeacherLogs();

            document.getElementById('back-to-list')?.addEventListener('click', showSidebarMobile);

            const teacherModal = document.getElementById('teacher-modal');
            const openTeacherBtn = document.getElementById('open-teacher-btn');
            const openTeacherBtnSidebar = document.getElementById('open-teacher-btn-sidebar');
            const closeTeacherModal = document.getElementById('close-teacher-modal');
            const clearLogsBtn = document.getElementById('clear-teacher-logs');
            const exportBtn = document.getElementById('export-report-btn');

            openTeacherBtn?.addEventListener('click', () => teacherModal?.classList.remove('hidden'));
            openTeacherBtnSidebar?.addEventListener('click', () => teacherModal?.classList.remove('hidden'));
            closeTeacherModal?.addEventListener('click', () => teacherModal?.classList.add('hidden'));

            clearLogsBtn?.addEventListener('click', () => {
                teacherLogs = [];
                stats = { correct: 0, streak: 0, total: 0, maxStreak: 0 };
                sessionSeconds = 0;
                document.getElementById('stat-correct').textContent = '0';
                document.getElementById('stat-streak').textContent = '0 стрик';
                document.getElementById('stat-progress').textContent = `0/${lessonTarget}`;
                updateTimerDisplay();
                renderTeacherLogs();
            });

            exportBtn?.addEventListener('click', () => {
                const reportData = {
                    student: studentName,
                    lessonDurationSeconds: sessionSeconds,
                    accuracy: stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) + '%' : '100%',
                    totalCompleted: stats.total,
                    logs: teacherLogs
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reportData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `report_${studentName}_lesson.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            });

            const emojiBtn = document.getElementById('emoji-btn');
            const emojiPicker = document.getElementById('emoji-picker');
            emojiBtn?.addEventListener('click', () => emojiPicker?.classList.toggle('hidden'));

            document.querySelectorAll('.emoji-item').forEach(item => {
                item.addEventListener('click', () => {
                    const input = document.getElementById('message-input');
                    if (input) input.value += item.textContent;
                    emojiPicker?.classList.add('hidden');
                });
            });

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    document.getElementById('sidebar')?.classList.remove('hidden');
                    document.getElementById('chat-window')?.classList.remove('hidden');
                    document.getElementById('chat-window')?.classList.add('flex');
                }
            });
        });
    </script>
</body>
</html>
